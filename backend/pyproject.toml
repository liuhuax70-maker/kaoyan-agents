[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kaoyan-agents-api"
version = "0.1.0"
description = "基于智能体的考研考证学习规划与督促系统 —— 后端服务"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.5.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.35,<2.1.0",
  "asyncpg>=0.30.0,<1.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "alembic>=1.13.0,<2.0.0",
  "redis>=5.0.8,<6.0.0",
  "httpx>=0.27.0,<1.0.0",
  "langchain-core>=0.3.0,<2.0.0",
  "langchain-openai>=0.2.0,<2.0.0",
  "langgraph>=0.2.0,<2.0.0",
  "crewai>=1.0.0,<2.0.0",
  "pymilvus>=2.4.9,<3.0.0",
  "celery[redis]>=5.4.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "fakeredis>=2.25.0,<3.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# 本地 alembic/ 是迁移脚本目录而非 Python 包，显式声明避免被误判为本地模块
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402", "F401"]
"tests/*" = ["S101"]
# FastAPI 依赖注入的标准写法就是在默认值里调用 Depends / Query / Body
"app/api/routes/*" = ["B008"]
