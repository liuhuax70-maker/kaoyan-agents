# LangFuse 自托管栈（可选）
#
# LangFuse v3 依赖 PostgreSQL + ClickHouse + Redis + MinIO 四个组件，
# 官方建议至少 4GB 可用内存。开发阶段更推荐直接用 LangFuse Cloud
# （免费额度够用，只需在 .env 里填三个变量）。
#
# ⚠️ 本文件未在开发机上实测（当时 Docker Desktop 守护进程未启动），
#    首次启动请留意 langfuse-web 的日志。
#
# 使用方式：
#   docker compose -f docker-compose.observability.yml up -d
#   浏览器打开 http://localhost:3001 注册账号并创建 API Key
#   把公钥/私钥填入主 .env：
#     OBSERVABILITY__LANGFUSE_ENABLED=true
#     OBSERVABILITY__LANGFUSE_PUBLIC_KEY=pk-lf-...
#     OBSERVABILITY__LANGFUSE_SECRET_KEY=sk-lf-...
#     OBSERVABILITY__LANGFUSE_HOST=http://localhost:3001

name: kaoyan-langfuse

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://postgres:postgres@langfuse-postgres:5432/langfuse
  # 生产环境请更换：openssl rand -hex 32
  SALT: kaoyan-agents-dev-salt
  ENCRYPTION_KEY: 4f2a9c1d7b3e5f8091a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  REDIS_CONNECTION_STRING: redis://langfuse-redis:6379
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  NEXTAUTH_URL: http://localhost:3001
  NEXTAUTH_SECRET: kaoyan-agents-dev-nextauth-secret
  TELEMETRY_ENABLED: 'false'

services:
  langfuse-postgres:
    image: postgres:16-alpine
    container_name: langfuse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d langfuse']
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: langfuse-clickhouse
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_ch:/var/lib/clickhouse
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-redis:
    image: redis:7-alpine
    container_name: langfuse-redis
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: langfuse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - '9090:9000'
      - '9091:9001'
    volumes:
      - langfuse_minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-minio-init:
    image: minio/mc:RELEASE.2024-05-24T09-08-45Z
    container_name: langfuse-minio-init
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set langfuse http://langfuse-minio:9000 minio miniosecret &&
      mc mb --ignore-existing langfuse/langfuse
      "

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    environment: *langfuse-env

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: langfuse-web
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio-init:
        condition: service_completed_successfully
    environment:
      <<: *langfuse-env
      HOSTNAME: 0.0.0.0
    ports:
      - '3001:3000'

volumes:
  langfuse_pg:
  langfuse_ch:
  langfuse_minio:
