name: kaoyan-agents

# 基础设施默认随 `docker compose up -d` 启动；
# 应用容器放在 app profile 下，用 `docker compose --profile app up -d` 一并启动。
# 这样在本地开发时可以只起基础设施，后端用 uvicorn 直接跑。

services:
  postgres:
    image: postgres:16-alpine
    container_name: kaoyan-postgres
    environment:
      POSTGRES_USER: kaoyan
      POSTGRES_PASSWORD: kaoyan
      POSTGRES_DB: kaoyan
      TZ: Asia/Shanghai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kaoyan -d kaoyan']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kaoyan-redis
    command: ['redis-server', '--appendonly', 'yes']
    environment:
      TZ: Asia/Shanghai
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: kaoyan-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: kaoyan-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: kaoyan-milvus
    command: ['milvus', 'run', 'standalone']
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - '19530:19530'
      - '9091:9091'
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9091/healthz']
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  backend:
    profiles: ['app']
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kaoyan-backend
    env_file:
      - .env
    environment:
      DATABASE__URL: postgresql+asyncpg://kaoyan:kaoyan@postgres:5432/kaoyan
      REDIS__URL: redis://redis:6379/0
      CELERY__BROKER_URL: redis://redis:6379/1
      CELERY__RESULT_BACKEND: redis://redis:6379/2
      CELERY__TASK_ALWAYS_EAGER: 'false'
      VECTOR__MILVUS_URI: http://milvus:19530
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000', '--reload']

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
